# STAGING Medplum for UCC (fake data only). Compose project: ucc-staging.
# Plan: .ai/PLAN-network-lockdown-staging.md Part 2. NOT started by CI or by any task; an operator runs ./up.sh.
# Isolated from production: no medplum-* names, no root_default/Traefik, nothing under /opt/medplum or /root,
# own volumes, own secrets. Every host port is bound to 127.0.0.1 (reach it via SSH tunnel).
# Secrets/config come from ./.env.staging.local and ./secrets/ (both git-ignored, generated by up.sh).
# Image tag is pinned (same as the dev server); change it only together with a rehearsed upgrade.
name: ucc-staging
services:
  ucc-stg-pg:
    image: postgres:16-alpine
    container_name: ucc-stg-pg
    restart: "no"        # runs only during a release test; must not return after a host reboot
    mem_limit: 768m
    memswap_limit: 768m
    env_file: [{path: .env.staging.local, required: false}]   # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: medplum
      POSTGRES_DB: medplum_staging
    volumes:
      - stg-pg:/var/lib/postgresql/data
    networks: [stg-net]               # no host port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum -d medplum_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  ucc-stg-redis:
    image: redis:7-alpine
    container_name: ucc-stg-redis
    restart: "no"        # runs only during a release test; must not return after a host reboot
    mem_limit: 128m
    memswap_limit: 128m
    env_file: [{path: .env.staging.local, required: false}]   # REDIS_PASSWORD
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 96mb"]
    networks: [stg-net]               # no host port
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  ucc-stg-medplum:
    image: medplum/medplum-server:${MEDPLUM_IMAGE_TAG:?set MEDPLUM_IMAGE_TAG (pinned, never latest)}
    container_name: ucc-stg-medplum
    restart: "no"        # runs only during a release test; must not return after a host reboot
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      ucc-stg-pg: { condition: service_healthy }
      ucc-stg-redis: { condition: service_healthy }
    # Config file generated by up.sh into ./secrets (contains DB/Redis passwords and the signing key).
    command: ["file:/run/ucc/medplum.config.json"]
    # The 0600 config is owned by the operator, but the image user (uid 1000) cannot read it (Task 578: EACCES on first
    # run). Run as the operator's uid/gid (exported by up.sh). Binary storage is therefore an ephemeral tmpfs owned by
    # that uid (fake data only; attachments vanish when staging stops, Postgres data stays).
    user: "${STG_UID:?run via up.sh}:${STG_GID:?run via up.sh}"
    tmpfs:
      - /run/ucc-binary:uid=${STG_UID},gid=${STG_GID},mode=0700,size=256m
    ports:
      - "127.0.0.1:8123:8103"        # staging API, loopback only (dev is 8113, prod is not touched)
    volumes:
      - ./secrets:/run/ucc:ro
    networks: [stg-net]

volumes:
  stg-pg:
networks:
  stg-net:
    ipam:
      config:
        - subnet: 172.31.58.0/24
          gateway: 172.31.58.1
